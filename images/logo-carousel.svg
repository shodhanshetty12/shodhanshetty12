<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="c1" x1="0" x2="1">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="50%" stop-color="#166EF0"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="120" fill="#071022" rx="8" />
  <g transform="translate(20,18)" font-family="Segoe UI, Roboto, sans-serif">
    <g fill="#0b1220">
      <!-- backdrop rounded cards -->
      <rect x="0" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
      <rect x="140" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
      <rect x="280" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
      <rect x="420" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
      <rect x="560" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
      <rect x="700" y="0" width="120" height="84" rx="10" fill="#0f1620"/>
    </g>
    <!-- labels that animate sliding left -->
    <g fill="url(#c1)">
      <text x="18" y="52" font-size="18" font-weight="700">Java</text>
      <text x="158" y="52" font-size="18" font-weight="700">Kotlin</text>
      <text x="298" y="52" font-size="18" font-weight="700">React</text>
      <text x="438" y="52" font-size="18" font-weight="700">Node.js</text>
      <text x="578" y="52" font-size="18" font-weight="700">Firebase</text>
      <text x="718" y="52" font-size="18" font-weight="700">Gemini</text>
    </g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; -120 0; -240 0; -360 0; -480 0; 0 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>