<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="w1" x1="0" x2="1"><stop offset="0%" stop-color="#ff9fb1"/><stop offset="100%" stop-color="#b3c7ff"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="#081019" />

  <!-- window frame -->
  <rect x="80" y="36" width="480" height="288" rx="6" fill="#09121b" stroke="#14314a" stroke-width="2" />
  <g transform="translate(100,56)">
    <!-- outside sky -->
    <rect width="440" height="248" fill="url(#w1)" />
    <!-- drifting petals -->
    <g fill="#ffd1e6" opacity="0.95">
      <path d="M320 20 q8 10 4 20 q-8 -8 -4 -20" opacity="0.9">
        <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; -20 60; 0 120" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M200 40 q6 8 3 16 q-6 -6 -3 -16" opacity="0.85">
        <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 30 80; 0 140" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- distant silhouette buildings -->
    <g fill="#071122" opacity="0.9">
      <rect x="0" y="180" width="60" height="68"/>
      <rect x="80" y="156" width="48" height="92"/>
      <rect x="150" y="170" width="78" height="78"/>
      <rect x="250" y="150" width="110" height="98"/>
      <rect x="380" y="168" width="60" height="80"/>
    </g>
  </g>

  <!-- small desk items silhouette -->
  <g transform="translate(110,220)" fill="#0c1622" opacity="0.95">
    <rect x="0" y="0" width="80" height="28" rx="4" />
    <rect x="100" y="-20" width="60" height="20" rx="3" />
    <rect x="180" y="-10" width="140" height="10" rx="2"/>
  </g>
</svg>